<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votação em Tempo Real</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Votação de Emojis 😄</h1>

        <div class="botoes">
            <button onclick="votar('gostei')">👍</button>
            <button onclick="votar('amei')">❤️</button>
            <button onclick="votar('triste')">😢</button>
        </div>

        <div class="placar">

            <div class="card">
                <h2>👍 Gostei</h2>
                <p id="gostei">0</p>
            </div>

            <div class="card">
                <h2>❤️ Amei</h2>
                <p id="amei">0</p>
            </div>

            <div class="card">
                <h2>😢 Triste</h2>
                <p id="triste">0</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
